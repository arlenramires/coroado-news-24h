<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coroado Play</title><style>body{background:#09192c;color:white;font:16px Arial;margin:0}header,main{padding:20px;max-width:1000px;margin:auto}header{background:#17375a;border-bottom:4px solid #c21d30}button{padding:12px;margin:6px;background:#183b62;color:white;border:1px solid #7993b3;border-radius:8px}iframe{width:100%;aspect-ratio:16/9;border:0;background:black}a{color:#8ad0ff}</style></head><body><header><h1>🔴 COROADO PLAY</h1><a href="index.html">Voltar ao portal</a></header><main><h2 id="title">Programação</h2><iframe id="screen" title="Vídeo" allowfullscreen allow="autoplay; fullscreen"></iframe><p id="description">Transmissões oficiais e conteúdos autorizados.</p><div id="list"></div><p>Programação composta apenas por vídeos próprios, licenciados ou liberados para incorporação. IPTV pago não autoriza retransmissão pública.</p></main><script>
fetch('coroado-play.json').then(r=>r.json()).then(items=>{const list=document.getElementById('list');items.forEach(item=>{const button=document.createElement('button');button.textContent=item.titulo+' — '+item.categoria;button.onclick=()=>{document.getElementById('title').textContent=item.titulo;document.getElementById('description').textContent=item.descricao;const frame=document.getElementById('screen');frame.removeAttribute('src');const url=new URL(item.url);if(item.tipo==='youtube'&&['youtube.com','www.youtube.com','youtu.be'].includes(url.hostname)){const id=url.hostname==='youtu.be'?url.pathname.slice(1):url.searchParams.get('v');if(id&&/^[a-zA-Z0-9_-]{11}$/.test(id))frame.src='https://www.youtube-nocookie.com/embed/'+id;}else if(item.tipo==='iframe'&&item.incorporacao_autorizada===true&&url.protocol==='https:')frame.src=url.href;else{const a=document.createElement('a');a.href=url.href;a.textContent='Ver na fonte oficial';a.target='_blank';document.getElementById('description').append(' ');document.getElementById('description').appendChild(a)}};list.appendChild(button)})}).catch(()=>document.getElementById('list').textContent='Programação indisponível');
</script></body></html>
