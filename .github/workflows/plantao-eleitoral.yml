name: Plantão eleitoral automático
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: plantao-eleitoral
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar fontes e publicar boletins
        run: python scripts/plantao_eleitoral.py
      - name: Salvar novas atualizações
        run: |
          if git diff --quiet -- eleicoes-boletins.json; then
            echo "Sem boletins novos verificados"
            exit 0
          fi
          git config user.name "Coroado News Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eleicoes-boletins.json
          git commit -m "Plantão eleitoral: boletins atualizados automaticamente"
          git push
